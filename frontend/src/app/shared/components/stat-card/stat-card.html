<mat-card class="stat-card" [class]="'tone-' + tone()">
  <mat-card-content>
    <div class="stat-header">
      <span class="stat-label">{{ label() }}</span>
      <mat-icon class="stat-icon">{{ icon() }}</mat-icon>
    </div>
    <div class="stat-value">{{ value() }}</div>
    @if (hint(); as hintText) {
      <div class="stat-hint">{{ hintText }}</div>
    }
  </mat-card-content>
</mat-card>
