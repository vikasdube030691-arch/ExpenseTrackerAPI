<div class="dialog-header" [class.destructive]="data.destructive">
  <mat-icon class="header-icon">{{ data.destructive ? 'warning' : 'help_outline' }}</mat-icon>
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <button mat-icon-button type="button" class="close-button" aria-label="Close" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>{{ data.message }}</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button
    mat-flat-button
    type="button"
    [color]="data.destructive ? 'warn' : 'primary'"
    (click)="confirm()"
  >
    {{ data.confirmLabel ?? 'Confirm' }}
  </button>
</mat-dialog-actions>
